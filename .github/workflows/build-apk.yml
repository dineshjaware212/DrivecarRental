name: Build DriveRent Manager APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager
          sdkmanager --version
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
      - name: Install Android API 36 platform
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --update || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-36"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list_installed
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.driverent .
          fi
      - name: Set Android compileSdk to 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = [0-9][0-9]*/compileSdk = 36/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion [0-9][0-9]*/compileSdkVersion 36/g' android/app/build.gradle
          fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: DriveRent-Manager-release
          path: build/app/outputs/flutter-apk/app-release.apk
