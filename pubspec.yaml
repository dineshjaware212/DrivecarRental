name: driverent_manager
description: DriveRent Manager - offline self-drive car rental management app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <6.0.0"

dependencies:
  flutter:
    sdk: flutter
  excel: ^4.0.6
  path_provider: ^2.1.5
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  file_picker: ^8.1.7
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/DriveRent_Database.xlsx
