workflows:
  android-release:
    name: GoCar Rental Services Android Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files
        script: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.driverent .
          fi
      - name: Set Android compileSdk to 36
        script: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = [0-9][0-9]*/compileSdk = 36/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion [0-9][0-9]*/compileSdkVersion 36/g' android/app/build.gradle
          fi
          grep -R "compileSdk" android/app/build.gradle* || true
      - name: Configure app name and contacts permission
        script: |
          sed -i 's/android:label="driverent_manager"/android:label="GoCar Rental Services"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.READ_CONTACTS' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.READ_CONTACTS" />' android/app/src/main/AndroidManifest.xml
          fi
      - name: Get packages
        script: flutter pub get
      - name: Analyze project
        script: flutter analyze --no-fatal-infos
      - name: Build release APK
        script: flutter build apk --release --no-pub
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
